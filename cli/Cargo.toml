[package]
name = "lace-cli"
version = "0.10.0"
authors = ["Redpoll"]
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
homepage = "https://www.lace.dev/"
repository = "https://github.com/promised-ai/lace"
description = "A probabilistic cross-categorization engine"

[build-dependencies]
dirs = "5"

[[bin]]
name = "lace"
path = "src/main.rs"

[dependencies]
lace = { workspace = true, features = ["formats", "ctrlc_handler"] }
clap = { version = "4.3.17", features = ["derive"] }
env_logger = "0.10"
serde_yaml = { workspace = true }

[dev-dependencies]
approx = "0.5.1"
tempfile = "3.4"
indoc = "2.0.3"
